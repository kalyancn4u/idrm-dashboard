[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short
    -p no:cacheprovider

markers =
    pg: test requires a real PostgreSQL instance (set IDRM_TEST_DATABASE_URL)
    slow: test takes more than a second
    rbac: role-based access control test

filterwarnings =
    ignore::DeprecationWarning:flask.*
    ignore::DeprecationWarning:werkzeug.*
